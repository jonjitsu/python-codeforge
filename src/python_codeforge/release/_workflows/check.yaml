name: check

# Pull requests gate branch work; pushes gate master after a merge. Keeping the
# workflow under .gitea prevents the public release mirror from running CI.
# Gitea does not enforce GitHub `permissions:` scoping, so this workflow carries no
# permissions block; authorization comes from the tokens each step binds.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python __PYTHON_VERSION__ quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.21"
          python-version: "__PYTHON_VERSION__"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run CI gates
        run: uv run invoke ci
