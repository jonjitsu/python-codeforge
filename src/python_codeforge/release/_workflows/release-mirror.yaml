name: release-mirror

# Mirroring is dispatched only after the canonical Gitea release exists. A GitHub
# outage can therefore be retried without retagging or changing that release: run
# this workflow by hand with the released tag. Nothing retries automatically.
# Gitea does not enforce GitHub `permissions:` scoping, so this workflow carries no
# permissions block; authorization comes from the tokens each step binds.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to mirror
        required: true

concurrency:
  group: release-mirror
  cancel-in-progress: false

env:
  # Gitea reserves GITHUB_ names for its own context variables.
  MIRROR: github.com/__GITHUB_REPOSITORY__.git
  MIRROR_REPOSITORY: __GITHUB_REPOSITORY__

jobs:
  mirror:
    name: Mirror the release to GitHub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the tag
        id: release
        env:
          TAG: ${{ inputs.tag }}
          GITEA_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
          API: ${{ github.server_url }}/api/v1
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "not a release version: $TAG" >&2
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null; then
            echo "no such tag: $TAG" >&2
            exit 1
          fi
          if ! curl -sf -H "Authorization: token $GITEA_TOKEN" \
            "$API/repos/$REPO/releases/tags/$TAG" > /dev/null; then
            echo "$TAG is not a canonical Gitea release" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check out the tagged release
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: git checkout --detach "refs/tags/$TAG"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.21"
          python-version: "__PYTHON_VERSION__"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Verify the tag matches the project release
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          version="$(uv run invoke release.version)"
          if [ "$version" != "$TAG" ]; then
            echo "tag $TAG does not match project version $version" >&2
            exit 1
          fi

      - name: Push the release to GitHub
        env:
          TOKEN: ${{ secrets.MIRROR_GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git remote add mirror "https://x-access-token:$TOKEN@$MIRROR"
          git push mirror "refs/tags/$TAG"
          git push mirror "$TAG^{commit}:refs/heads/master"

      - name: Create or update the GitHub release
        env:
          TOKEN: ${{ secrets.MIRROR_GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          notes="$(uv run invoke release.notes)"
          if [ -z "$notes" ]; then
            echo "no changelog section for $TAG" >&2
            exit 1
          fi
          api="https://api.github.com/repos/$MIRROR_REPOSITORY"
          release_id="$(curl -sf \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api/releases/tags/$TAG" | jq -r '.id // empty' || true)"
          payload="$(jq -n --arg t "$TAG" --arg b "$notes" \
            '{tag_name:$t, name:("__PROJECT_NAME__ " + $t), body:$b}')"
          if [ -n "$release_id" ]; then
            curl -sf -X PATCH \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" -d "$payload" \
              "$api/releases/$release_id" > /dev/null
            echo "updated __PROJECT_NAME__ $TAG on GitHub"
          else
            curl -sf -X POST \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" -d "$payload" \
              "$api/releases" > /dev/null
            echo "published __PROJECT_NAME__ $TAG on GitHub"
          fi
