name: File pip-audit upstream issue

on:
  push:
    branches:
      - chore/file-pip-audit-upstream-issue

permissions:
  issues: write

jobs:
  file-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Create upstream issue when missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title='security.audit: export python-codeforge with a pip-audit hashable requirement'
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" --jq ".[] | select(.title == \"${title}\") | .html_url")"
          if [ -n "$existing" ]; then
            echo "Issue already exists: $existing"
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/issues" \
            -f title="$title" \
            -f body='`security.audit` runs `uv export` then `pip-audit --strict`. When Codeforge is a git dependency of the consuming project, the export is a bare VCS URL and `pip-audit --strict` fails (pip cannot hash VCS installs).

          Downstream Lab3 overrides `security.audit` with `--no-emit-package python-codeforge` (trading/lab3#46).

          **Fix:** export a hashable `python-codeforge` line and demonstrate `pip-audit --strict` passes against an export that includes it.' \
            --jq '.html_url'
