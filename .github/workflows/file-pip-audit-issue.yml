name: File pip-audit upstream issue

on:
  push:
    branches:
      - chore/file-pip-audit-upstream-issue

permissions:
  issues: write

jobs:
  file-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Create upstream issue when missing
        uses: actions/github-script@ed597411d8f9240738dde9c2b7c00a45d257c550 # v8.0.0
        with:
          script: |
            const title =
              "security.audit: export python-codeforge with a pip-audit hashable requirement";
            const body = [
              "`security.audit` runs `uv export` then `pip-audit --strict`.",
              "When Codeforge is a git dependency of the consuming project, the export is a bare",
              "VCS URL and `pip-audit --strict` fails (pip cannot hash VCS installs).",
              "",
              "Downstream Lab3 overrides `security.audit` with",
              "`--no-emit-package python-codeforge` (trading/lab3#46).",
              "",
              "**Fix:** export a hashable `python-codeforge` line and demonstrate",
              "`pip-audit --strict` passes against an export that includes it.",
            ].join("\n");

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "all",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              core.info(`Issue already exists: ${existing.html_url}`);
              return;
            }

            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
            core.info(`Created ${issue.html_url}`);
