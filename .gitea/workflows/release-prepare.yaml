name: release-prepare

# Every merge to master refreshes a standing release pull request. Merging that
# pull request is the human release decision; it does not publish from this job.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release-prepare
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: Refresh the release pull request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.21"
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Prepare the bump
        id: prepare
        run: |
          set -euo pipefail
          uv run invoke release-prepare
          if git diff --quiet; then
            echo "prepared=false" >> "$GITHUB_OUTPUT"
            echo "nothing to release"
            exit 0
          fi
          version="$(uv run invoke release-version)"
          if [ -z "$version" ]; then
            echo "could not read the prepared version" >&2
            exit 1
          fi
          echo "prepared=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Re-sync onto the bumped lock
        if: steps.prepare.outputs.prepared == 'true'
        run: uv sync --locked --all-groups

      - name: Verify the prepared tree
        if: steps.prepare.outputs.prepared == 'true'
        run: uv run invoke ci

      - name: Push the release branch
        if: steps.prepare.outputs.prepared == 'true'
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          git config user.name "python-codeforge release"
          git config user.email "noreply@gitea.home.arpa"
          git switch -C release/next
          git commit -am "release: $VERSION"
          git push --force origin release/next

      - name: Open or update the release pull request
        if: steps.prepare.outputs.prepared == 'true'
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ steps.prepare.outputs.version }}
          REPO: ${{ github.repository }}
          API: ${{ github.server_url }}/api/v1
        run: |
          set -euo pipefail
          body="$(uv run invoke release-notes)"
          if [ -z "$body" ]; then
            echo "no changelog section for $VERSION" >&2
            exit 1
          fi
          existing="$(curl -sf -H "Authorization: token $GITEA_TOKEN" \
            "$API/repos/$REPO/pulls?state=open" \
            | jq -r '[.[] | select(.head.ref == "release/next")][0].number // empty')"
          if [ -n "$existing" ]; then
            payload="$(jq -n --arg t "Release $VERSION" --arg b "$body" \
              '{title:$t, body:$b}')"
            curl -sf -X PATCH -H "Authorization: token $GITEA_TOKEN" \
              -H "Content-Type: application/json" -d "$payload" \
              "$API/repos/$REPO/pulls/$existing" > /dev/null
            echo "updated pull request #$existing to $VERSION"
          else
            payload="$(jq -n --arg t "Release $VERSION" --arg b "$body" \
              '{title:$t, body:$b, head:"release/next", base:"master"}')"
            curl -sf -X POST -H "Authorization: token $GITEA_TOKEN" \
              -H "Content-Type: application/json" -d "$payload" \
              "$API/repos/$REPO/pulls" > /dev/null
            echo "opened a release pull request for $VERSION"
          fi
